modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="MrAIinator"
description='''
Server-side plugin loader for a NeoForge 1.21.1 modpack.
Drop plugin jars into the dedicated server plugins/ folder.
Clients do not need this mod. It does not register blocks, items, or network packets.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1,21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
side="BOTH"
